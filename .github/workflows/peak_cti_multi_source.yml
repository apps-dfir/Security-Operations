name: PEAK CTI Multi-Source Processor

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Prevent race conditions: queue workflows instead of running in parallel
# This ensures each workflow sees the latest merged reports when it starts
concurrency:
  group: peak-cti-report-generation
  cancel-in-progress: false

jobs:
  process-multi-source:
    if: github.event.label.name == 'multi-source'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PEAK_BOT_PAT }}
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: peak/cti/requirements.txt

      - name: Install Dependencies
        run: |
          cd peak/cti
          pip install -r requirements.txt
          python -m playwright install chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Refresh MITRE ATT&CK Data
        run: |
          echo "Downloading latest MITRE ATT&CK Enterprise data..."
          cd peak/cti/data
          curl -L --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json" \
            -o enterprise-attack.json
          
          # Verify download
          if [ -f "enterprise-attack.json" ]; then
            SIZE=$(stat -f%z "enterprise-attack.json" 2>/dev/null || stat -c%s "enterprise-attack.json")
            echo "MITRE ATT&CK data downloaded: ${SIZE} bytes"
            
            # Basic validation - check this is valid JSON with techniques
            if python3 -c "import json; d=json.load(open('enterprise-attack.json')); print(f'Objects: {len(d.get(\"objects\", []))}')" 2>/dev/null; then
              echo "MITRE data validated"
            else
              echo "MITRE data validation failed"
              exit 1
            fi
          else
            echo "Failed to download MITRE ATT&CK data"
            exit 1
          fi

      - name: Parse Issue Body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            
            // Extract sources (numbered list 1-5)
            const sourceMatches = body.match(/(?:^|\n)\s*\d+\.\s*(.+)/gm) || [];
            const sources = sourceMatches
              .map(s => s.replace(/^\s*\d+\.\s*/, '').trim())
              .filter(s => s && !s.startsWith('#'))
              .slice(0, 5);
            
            // Extract analyst name
            const analystMatch = body.match(/### Analyst\s*\n+([^\n#]+)/i);
            const analyst = analystMatch ? analystMatch[1].trim() : 'Unknown';
            
            // Extract OCR setting
            const ocrMatch = body.match(/### Enable OCR\s*\n+([^\n#]+)/i);
            const enableOcr = ocrMatch ? ocrMatch[1].trim().toLowerCase() : 'no';
            
            console.log('Sources:', sources);
            console.log('Analyst:', analyst);
            console.log('OCR:', enableOcr);
            
            core.setOutput('sources', JSON.stringify(sources));
            core.setOutput('analyst', analyst);
            core.setOutput('enable_ocr', enableOcr === 'yes' || enableOcr === 'true' ? 'true' : 'false');
            core.setOutput('source_count', sources.length.toString());

      - name: Validate Sources
        id: validate
        run: |
          SOURCES='${{ steps.parse.outputs.sources }}'
          COUNT=${{ steps.parse.outputs.source_count }}
          
          if [ "$COUNT" -eq "0" ]; then
            echo "No valid sources found in issue body"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Found $COUNT source(s) to process"
          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Check for Duplicate Sources
        if: steps.validate.outputs.valid == 'true'
        id: dedup
        run: |
          cd peak/cti
          
          SOURCES='${{ steps.parse.outputs.sources }}'
          ISSUE_NUMBER='${{ github.event.issue.number }}'
          
          # Parse sources and check each for duplicates
          NEW_SOURCES=$(python3 << 'PYEOF'
          import json
          import subprocess
          import sys
          
          sources = json.loads('${{ steps.parse.outputs.sources }}')
          new_sources = []
          
          for src in sources:
              src = src.strip()
              if not src:
                  continue
              
              # Determine if URL or file
              if src.startswith('http://') or src.startswith('https://'):
                  cmd = ['python3', 'scripts/check_source_duplicate.py', 
                         '--url', src, 
                         '--issue-number', '${{ github.event.issue.number }}',
                         '--database', 'data/ioc_database.json',
                         '--quiet']
              else:
                  # File source
                  file_path = src if src.startswith('inputs/') else f'inputs/{src}'
                  cmd = ['python3', 'scripts/check_source_duplicate.py',
                         '--file', file_path,
                         '--issue-number', '${{ github.event.issue.number }}',
                         '--database', 'data/ioc_database.json',
                         '--inputs-dir', 'inputs',
                         '--quiet']
              
              result = subprocess.run(cmd, capture_output=True)
              
              if result.returncode == 0:
                  # Not a duplicate
                  new_sources.append(src)
                  print(f"New source: {src}", file=sys.stderr)
              else:
                  print(f"Duplicate skipped: {src}", file=sys.stderr)
          
          print(json.dumps(new_sources))
          PYEOF
          )
          
          echo "new_sources=$NEW_SOURCES" >> $GITHUB_OUTPUT
          
          COUNT=$(echo "$NEW_SOURCES" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "new_count=$COUNT" >> $GITHUB_OUTPUT
          echo "$COUNT new source(s) to process"

      - name: Prepare Multi-Source Input
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        run: |
          cd peak/cti
          
          SOURCES='${{ steps.dedup.outputs.new_sources }}'
          
          # Create multi-source input file
          python3 -c "
          import json
          sources = json.loads('$SOURCES')
          inputs = []
          for src in sources:
              src = src.strip()
              if src.startswith('http://') or src.startswith('https://'):
                  inputs.append({'type': 'url', 'value': src})
              elif src.startswith('inputs/'):
                  inputs.append({'type': 'file', 'value': src})
              elif '.' in src and not ' ' in src:
                  inputs.append({'type': 'file', 'value': f'inputs/{src}'})
          
          with open('data/multi_source_inputs.json', 'w') as f:
              json.dump({'sources': inputs}, f, indent=2)
          print(f'Prepared {len(inputs)} sources for processing')
          "

      - name: Generate Consolidated Report
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        id: generate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd peak/cti
          
          python3 generate_consolidated_report.py \
            --sources-json data/multi_source_inputs.json \
            --analyst "${{ steps.parse.outputs.analyst }}" \
            --enable-ocr "${{ steps.parse.outputs.enable_ocr }}" \
            --issue-number "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --issue-url "$ISSUE_URL" \
            --repo-url "$REPO_URL"
          
          # Find the generated report
          REPORT=$(ls -t reports/issue-${ISSUE_NUMBER}_*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            echo "report_path=$REPORT" >> $GITHUB_OUTPUT
            echo "Report generated: $REPORT"
          else
            echo "No report file found"
            exit 1
          fi

      - name: Build IOC Database
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        run: |
          cd peak/cti
          python3 scripts/build_ioc_database.py \
            --reports-dir reports \
            --output data/ioc_database.json

      - name: Tag Overlapping IOCs
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        run: |
          cd peak/cti
          REPORT="${{ steps.generate.outputs.report_path }}"
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            python3 scripts/tag_overlapping_iocs.py \
              --report "$REPORT" \
              --database data/ioc_database.json \
              --in-place
          fi

      - name: Correlate IOCs
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        run: |
          cd peak/cti
          REPORT="${{ steps.generate.outputs.report_path }}"
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            python3 scripts/correlate_iocs.py \
              --report "$REPORT" \
              --database data/ioc_database.json \
              --repo-url "${{ github.server_url }}/${{ github.repository }}"
          fi

      - name: Generate Dashboard
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        run: |
          cd peak/cti
          python3 scripts/generate_dashboard.py \
            --reports-dir reports \
            --database data/ioc_database.json \
            --output-html dashboard/index.html \
            --output-stats STATS.md \
            --repo-url "${{ github.server_url }}/${{ github.repository }}"

      - name: Copy Dashboard to Root Docs
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        run: |
          cd ${{ github.workspace }}
          
          mkdir -p docs
          
          if [ -f "peak/cti/dashboard/index.html" ]; then
            cp peak/cti/dashboard/index.html docs/dashboard.html
            echo "Dashboard copied to docs/dashboard.html"
          fi
          
          if [ -f "peak/cti/data/dashboard_metrics.json" ]; then
            cp peak/cti/data/dashboard_metrics.json docs/metrics.json
            echo "Metrics copied to docs/metrics.json"
          fi

      - name: Create Pull Request
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PEAK_BOT_PAT }}
          commit-message: "PEAK CTI report for issue #${{ github.event.issue.number }}"
          branch: peak-drafts/issue-${{ github.event.issue.number }}
          title: "PEAK CTI: ${{ github.event.issue.title }}"
          add-paths: |
            peak/cti/reports/
            peak/cti/data/ocr_images/
            peak/cti/data/ioc_database.json
            peak/cti/data/enterprise-attack.json
            peak/cti/dashboard/
            peak/cti/STATS.md
            docs/dashboard.html
            docs/metrics.json
          body: |
            ## PEAK CTI Report
            
            **Issue:** #${{ github.event.issue.number }}
            **Analyst:** ${{ steps.parse.outputs.analyst }}
            **Sources Processed:** ${{ steps.dedup.outputs.new_count }}
            **OCR Enabled:** ${{ steps.parse.outputs.enable_ocr }}
            
            ### Generated Files
            - Report: `${{ steps.generate.outputs.report_path }}`
            - Dashboard: `peak/cti/dashboard/index.html`
            - IOC Database: `peak/cti/data/ioc_database.json`
            - MITRE Data: `peak/cti/data/enterprise-attack.json` (refreshed)
            
            ### Review Checklist
            - [ ] Verify IOC extractions
            - [ ] Verify MITRE technique extractions
            - [ ] Review confidence scores
            - [ ] Add analyst notes if needed
            
            ### Before Merging
            If this branch is out of date with `main`, click **"Update branch"** before merging.
            This ensures the IOC database includes all previously merged reports.
            
            ---
            *Auto-generated by PEAK CTI v3.0*
          labels: |
            peak-cti
            automated

      - name: Comment on Issue - Success
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const reportPath = '${{ steps.generate.outputs.report_path }}';
            const sourceCount = '${{ steps.dedup.outputs.new_count }}';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PEAK CTI Processing Complete
            
            **Sources Processed:** ${sourceCount}
            **Report:** \`${reportPath}\`
            
            A Pull Request has been created with the consolidated report. Please review and merge.
            
            ---
            *PEAK CTI v3.0*`
            });

      - name: Comment on Issue - No New Sources
        if: steps.validate.outputs.valid == 'true' && steps.dedup.outputs.new_count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## No New Sources
            
            All submitted sources have already been processed in previous reports.
            
            Please submit different sources or check existing reports.
            
            ---
            *PEAK CTI v3.0*`
            });

      - name: Comment on Issue - Invalid
        if: steps.validate.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Invalid Submission
            
            No valid sources found in the issue body.
            
            Please use the issue template and provide sources as a numbered list:
            \`\`\`
            1. <url-to-article>
            2. inputs/report.pdf
            \`\`\`
            
            ---
            *PEAK CTI v3.0*`
            });